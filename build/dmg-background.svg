<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff" />
      <stop offset="1" stop-color="#f3f6fa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#193651" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="340" fill="url(#background)" />

  <text x="40" y="34" fill="#172b3d" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="600">安装图渡</text>
  <text x="40" y="58" fill="#637381" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13">第 1 步：将图渡拖入 Applications 文件夹</text>

  <path d="M 218 120 H 306" fill="none" stroke="#8aa4ba" stroke-width="3" stroke-linecap="round" />
  <path d="M 296 110 L 308 120 L 296 130" fill="none" stroke="#8aa4ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <line x1="510" y1="72" x2="510" y2="176" stroke="#d7e0e8" stroke-width="1" />

  <g filter="url(#shadow)">
    <rect x="30" y="188" width="660" height="142" rx="16" fill="#ffffff" />
  </g>
  <circle cx="58" cy="212" r="11" fill="#fff2db" />
  <text x="58" y="217" text-anchor="middle" fill="#a56400" font-family="Helvetica Neue, sans-serif" font-size="14" font-weight="700">!</text>
  <text x="80" y="217" fill="#20384d" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14" font-weight="600">首次打开可能出现：</text>
  <text x="58" y="242" fill="#9f3b32" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="600">“图渡”已损坏，无法打开。你应该将它移到废纸篓。</text>
  <text x="58" y="267" fill="#405768" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13">1. 点击“取消”，打开 系统设置 → 隐私与安全性</text>
  <text x="58" y="291" fill="#405768" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13">2. 滚动到页面最底部的“安全性”，点击“仍要打开”</text>
  <text x="58" y="315" fill="#6a7c8a" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="11">按钮仅在尝试打开后出现（约保留一小时）；若找不到，请双击右侧修复。</text>
</svg>
