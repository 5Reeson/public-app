<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff" />
      <stop offset="1" stop-color="#f3f6fa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#193651" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="460" fill="url(#background)" />

  <text x="40" y="48" fill="#172b3d" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="24" font-weight="600">安装图渡</text>
  <text x="40" y="76" fill="#637381" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14">将图渡拖入 Applications 文件夹</text>

  <path d="M 218 205 H 306" fill="none" stroke="#8aa4ba" stroke-width="3" stroke-linecap="round" />
  <path d="M 296 195 L 308 205 L 296 215" fill="none" stroke="#8aa4ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <line x1="510" y1="126" x2="510" y2="271" stroke="#d7e0e8" stroke-width="1" />

  <g filter="url(#shadow)">
    <rect x="40" y="305" width="640" height="112" rx="18" fill="#ffffff" />
  </g>
  <circle cx="68" cy="337" r="13" fill="#eaf2f9" />
  <text x="68" y="342" text-anchor="middle" fill="#254b6c" font-family="Helvetica Neue, sans-serif" font-size="16" font-weight="700">i</text>
  <text x="92" y="342" fill="#20384d" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="16" font-weight="600">首次打开提示</text>
  <text x="68" y="373" fill="#5e7181" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14">若系统提示“图渡已损坏”，请先完成上方拖拽，</text>
  <text x="68" y="397" fill="#5e7181" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14">再双击右侧“打不开？双击修复”并按提示操作。</text>
</svg>
